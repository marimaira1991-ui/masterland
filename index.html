<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterLand — Made with a soul</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pink:#E8728A;--pink-light:#F4B8C4;--pink-pale:#FDE8EC;
  --pink-bg:#FDF0F3;--cream:#FAFAF8;--dark:#2D2528;
  --muted:#8A7880;--border:#F0DCE0;--white:#FFFFFF;
}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;}

/* ---- HEADER ---- */
header{background:var(--white);border-bottom:1.5px solid var(--border);padding:0 2rem;height:72px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.logo-wrap{display:flex;align-items:center;gap:12px;cursor:pointer;}
.logo-img{height:50px;width:50px;object-fit:contain;border-radius:50%;}
.logo-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--dark);}
.logo-soul{font-size:11px;color:var(--pink);letter-spacing:1.5px;text-transform:uppercase;}
.header-right{display:flex;align-items:center;gap:12px;}
.lang-switcher{display:flex;gap:4px;}
.lang-btn{padding:5px 10px;border-radius:999px;border:1.5px solid var(--border);background:transparent;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
.lang-btn:hover{border-color:var(--pink-light);color:var(--pink);}
.lang-btn.active{background:var(--pink);border-color:var(--pink);color:white;}
.nav-catalog-btn{padding:8px 18px;border-radius:999px;background:var(--pink);color:white;border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.nav-catalog-btn:hover{opacity:.85;}

/* ---- PAGES ---- */
.page{display:none;}
.page.active{display:block;}

/* ---- HERO ---- */
.hero{background:linear-gradient(135deg,#FDE8EC 0%,#FDF5F7 55%,#FFF8F0 100%);padding:4rem 2rem 3rem;text-align:center;border-bottom:1px solid var(--border);}
.hero-logo{width:130px;height:130px;object-fit:contain;margin-bottom:1.2rem;filter:drop-shadow(0 6px 20px rgba(232,114,138,.25));}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(32px,5vw,56px);font-weight:700;color:var(--dark);margin-bottom:.6rem;line-height:1.1;}
.hero h1 em{font-style:italic;color:var(--pink);font-weight:400;}
.hero-sub{font-size:15px;color:var(--muted);max-width:440px;margin:0 auto 1.5rem;line-height:1.7;}
.hero-cta{display:inline-block;padding:14px 36px;background:var(--pink);color:white;border:none;border-radius:999px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;}
.hero-cta:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,114,138,.35);}
.hero-stats{display:flex;justify-content:center;gap:3rem;margin-top:2.5rem;flex-wrap:wrap;}
.stat{text-align:center;}
.stat-num{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--pink);}
.stat-label{font-size:13px;color:var(--muted);font-weight:500;}

/* ---- SECTION ---- */
.section{max-width:1100px;margin:0 auto;padding:3rem 2rem;}
.section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.5rem;}
.section-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--dark);}
.section-link{font-size:13px;font-weight:700;color:var(--pink);cursor:pointer;text-decoration:none;}
.section-link:hover{text-decoration:underline;}

/* ---- CATEGORY CARDS ---- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
.cat-card{background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:1.5rem 1rem;text-align:center;cursor:pointer;transition:all .2s;}
.cat-card:hover{border-color:var(--pink-light);transform:translateY(-3px);box-shadow:0 8px 20px rgba(232,114,138,.12);}
.cat-card-emoji{font-size:36px;margin-bottom:.6rem;}
.cat-card-name{font-size:14px;font-weight:700;color:var(--dark);}
.cat-card-count{font-size:12px;color:var(--muted);margin-top:2px;}

/* ---- PRODUCT CARDS ---- */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;}
.card{background:var(--white);border-radius:16px;overflow:hidden;border:1.5px solid var(--border);transition:transform .2s,box-shadow .2s;cursor:pointer;}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(232,114,138,.15);border-color:var(--pink-light);}
.card-img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--pink-bg);}
.card-img-ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:52px;background:var(--pink-bg);}
.card-badge{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.card-badge.new{background:#E8F5E9;color:#2E7D32;}
.card-badge.hit{background:#FFF3E0;color:#E65100;}
.card-wrap{position:relative;}
.card-body{padding:12px 14px 16px;}
.card-master{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--pink);margin-bottom:3px;cursor:pointer;}
.card-master:hover{text-decoration:underline;}
.card-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--dark);line-height:1.3;margin-bottom:10px;}
.card-bottom{display:flex;align-items:center;justify-content:space-between;}
.card-price{font-size:16px;font-weight:800;color:var(--dark);}
.card-cat{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--pink-pale);color:var(--pink);}

/* ---- MASTERS SECTION ---- */
.masters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.master-card{background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;}
.master-card:hover{border-color:var(--pink-light);transform:translateY(-3px);box-shadow:0 8px 20px rgba(232,114,138,.12);}
.master-avatar{width:64px;height:64px;border-radius:50%;background:var(--pink-pale);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto .8rem;}
.master-name{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:4px;}
.master-cat{font-size:12px;color:var(--muted);}
.master-count{font-size:12px;font-weight:600;color:var(--pink);margin-top:4px;}

/* ---- FILTERS (CATALOG) ---- */
.filters-bar{background:var(--white);border-bottom:1px solid var(--border);padding:1rem 2rem;position:sticky;top:72px;z-index:100;}
.filters-inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.filter-label{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);min-width:80px;}
.pill-btn{padding:6px 15px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;}
.pill-btn:hover{border-color:var(--pink-light);color:var(--pink);}
.pill-btn.active{background:var(--pink);border-color:var(--pink);color:white;}
.filter-bottom{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.price-wrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600;}
.price-wrap input[type=range]{width:130px;accent-color:var(--pink);}
#priceVal{font-weight:700;color:var(--dark);}
select.sort-sel{font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;border:1.5px solid var(--border);border-radius:20px;padding:6px 12px;background:white;color:var(--muted);cursor:pointer;margin-left:auto;}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.active-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;background:var(--pink-pale);border:1px solid var(--pink-light);border-radius:999px;font-size:12px;font-weight:600;color:var(--pink);cursor:pointer;}
.active-tag:hover{background:var(--pink);color:white;}
.clear-all{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-decoration:underline;}
.clear-all:hover{color:var(--pink);}

/* ---- CATALOG PAGE ---- */
.catalog-main{max-width:1100px;margin:0 auto;padding:1.5rem 2rem 3rem;}
.results-line{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:1.2rem;}

/* ---- PRODUCT PAGE ---- */
.product-page{max-width:900px;margin:0 auto;padding:2rem;}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:1.5rem;border:none;background:none;font-family:'Nunito',sans-serif;}
.back-btn:hover{color:var(--pink);}
.product-layout{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;}
.product-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:var(--pink-bg);}
.product-img-ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:80px;border-radius:16px;background:var(--pink-bg);}
.product-info{display:flex;flex-direction:column;gap:1rem;}
.product-master-link{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--pink);cursor:pointer;}
.product-master-link:hover{text-decoration:underline;}
.product-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;line-height:1.2;color:var(--dark);}
.product-price{font-size:28px;font-weight:800;color:var(--dark);}
.product-cat{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--pink-pale);color:var(--pink);font-size:13px;font-weight:600;}
.product-desc{font-size:15px;color:var(--muted);line-height:1.7;}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;background:#25D366;color:white;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;text-decoration:none;}
.wa-btn:hover{opacity:.9;}
.wa-btn-general{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;background:white;color:#25D366;border:2px solid #25D366;border-radius:12px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;text-decoration:none;margin-top:8px;}
.wa-btn-general:hover{background:#25D366;color:white;}

/* ---- MASTER PAGE ---- */
.master-page{max-width:1100px;margin:0 auto;padding:2rem;}
.master-header{background:linear-gradient(135deg,#FDE8EC,#FFF8F0);border-radius:20px;padding:2.5rem;text-align:center;margin-bottom:2rem;}
.master-header-avatar{width:90px;height:90px;border-radius:50%;background:var(--pink-pale);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 1rem;}
.master-header-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--dark);margin-bottom:.4rem;}
.master-header-cat{font-size:14px;color:var(--muted);}
.master-header-desc{font-size:15px;color:var(--muted);max-width:480px;margin:1rem auto 0;line-height:1.6;}

/* ---- NOTICE ---- */
.setup-notice{background:var(--pink-pale);border:1.5px solid var(--pink-light);border-radius:12px;padding:1.2rem 1.5rem;margin-bottom:1.5rem;font-size:14px;color:var(--dark);line-height:1.6;}
.setup-notice strong{color:var(--pink);}

/* ---- WA FLOAT ---- */
.wa-float{position:fixed;bottom:24px;right:24px;z-index:999;width:56px;height:56px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.4);cursor:pointer;transition:transform .2s;}
.wa-float:hover{transform:scale(1.1);}
.wa-float svg{width:28px;height:28px;fill:white;}

/* ---- FOOTER ---- */
footer{background:var(--dark);color:var(--pink-light);text-align:center;padding:2.5rem 2rem;margin-top:2rem;}
.f-logo{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:white;letter-spacing:1px;margin-bottom:4px;}
.f-soul{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.7;}
.f-info{font-size:13px;margin-top:.8rem;opacity:.6;}

/* ---- SPINNER ---- */
.spinner{width:36px;height:36px;border:3px solid var(--pink-pale);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-wrap{text-align:center;padding:4rem;color:var(--muted);}

@media(max-width:640px){
  header{padding:0 1rem;height:60px;}
  .logo-name{font-size:17px;}
  .nav-catalog-btn{display:none;}
  .hero{padding:2.5rem 1rem 2rem;}
  .hero-logo{width:90px;height:90px;}
  .hero-stats{gap:1.5rem;}
  .section{padding:2rem 1rem;}
  .filters-bar{padding:.75rem 1rem;top:60px;}
  .filter-label{min-width:60px;font-size:11px;}
  .catalog-main{padding:1rem;}
  .products-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
  .product-layout{grid-template-columns:1fr;}
  .master-page{padding:1rem;}
}
</style>
</head>
